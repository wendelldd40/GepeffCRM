  --sidew:252px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111014;
    --surface:#1A171B;
    --surface-2:#221E23;
    --ink:#F1EDEF;
    --ink-2:#ABA2A8;
    --ink-3:#7A7178;
    --line:#302A30;
    --line-2:#262127;
    --wine:#C2455E;
    --wine-600:#D4566E;
    --wine-tint:#2A1218;
    --ok:#4FBF8B; --ok-bg:#12291F;
    --warn:#D3A429; --warn-bg:#2A2312;
    --crit:#E0714F; --crit-bg:#2C1811;
    --info:#63A9CE; --info-bg:#12222B;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --paper:#111014; --surface:#1A171B; --surface-2:#221E23;
  --ink:#F1EDEF; --ink-2:#ABA2A8; --ink-3:#7A7178;
  --line:#302A30; --line-2:#262127;
  --wine:#C2455E; --wine-600:#D4566E; --wine-tint:#2A1218;
  --ok:#4FBF8B; --ok-bg:#12291F;
  --warn:#D3A429; --warn-bg:#2A2312;
  --crit:#E0714F; --crit-bg:#2C1811;
  --info:#63A9CE; --info-bg:#12222B;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 12px 30px -20px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0; background:var(--paper); color:var(--ink); font-family:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14.5px; line-height:1.55; -webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.disp{font-family:'Archivo Narrow','Arial Narrow',Archivo,sans-serif; font-weight:700; letter-spacing:-.004em; margin:0; text-wrap:balance}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
input,select,textarea{font:inherit}
a{color:var(--wine)}
:focus-visible{outline:2px solid var(--wine-600); outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-family:'Archivo Narrow',sans-serif; font-weight:600; text-transform:uppercase; letter-spacing:.13em; font-size:10.5px; color:var(--ink-3)}

/* ================= SHELL ================= */
.shell{display:grid; grid-template-columns:var(--sidew) 1fr; min-height:100dvh}
.sidebar{position:sticky; top:0; height:100dvh; overflow-y:auto; color:var(--side-ink);
  background:linear-gradient(178deg, var(--wine-700) 0%, var(--wine-800) 46%, var(--wine-900) 100%);
  display:flex; flex-direction:column; scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16); border-radius:6px}
.side-brand{display:flex; align-items:center; gap:11px; padding:17px 16px 15px; border-bottom:1px solid rgba(255,255,255,.11)}
.side-brand img{width:40px; height:40px; flex:none; border-radius:50%; background:#fff}
.side-brand b{display:block; font-family:'Archivo Narrow',sans-serif; font-size:17px; letter-spacing:.02em; color:#fff; line-height:1.1}
.side-brand small{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.11em; color:var(--side-ink-2); margin-top:2px}
.navgroup{padding:14px 10px 2px}
.navgroup > span{display:block; padding:0 8px 7px; font-family:'Archivo Narrow',sans-serif; font-weight:600;
  font-size:10px; text-transform:uppercase; letter-spacing:.15em; color:var(--side-ink-2)}
.navitem{display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:8px 9px; border-radius:var(--radius);
  color:var(--side-ink); font-size:13.5px; font-weight:500; position:relative; transition:background .13s}
.navitem svg{width:16px; height:16px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; opacity:.85}
.navitem:hover{background:rgba(255,255,255,.09)}
.navitem.on{background:rgba(255,255,255,.15); color:#fff; font-weight:600}
.navitem.on::before{content:""; position:absolute; left:-10px; top:6px; bottom:6px; width:3px; background:#fff; border-radius:0 3px 3px 0}
.navitem .count{margin-left:auto; font-size:10.5px; font-weight:700; background:rgba(255,255,255,.17); border-radius:99px; padding:1px 7px; font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto; padding:12px 14px 16px; border-top:1px solid rgba(255,255,255,.11); font-size:10.5px; color:var(--side-ink-2); line-height:1.45}
.side-foot button{color:var(--side-ink); font-size:11.5px; font-weight:600; text-decoration:underline; text-underline-offset:3px}
.sidestatus{display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; border-radius:99px; padding:3px 9px; margin-bottom:7px; max-width:100%;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sidestatus::before{content:""; width:6px; height:6px; border-radius:50%; flex:none}
.sidestatus.on{background:rgba(120,220,170,.16); color:#A9E9C9}
.sidestatus.on::before{background:#5FD8A0}
.sidestatus.off{background:rgba(255,255,255,.12); color:var(--side-ink-2)}
.sidestatus.off::before{background:#D3A9B1}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:11px clamp(14px,3vw,28px)}
.topbar h1{font-size:20px; line-height:1.15}
.topbar .sub{font-size:11.5px; color:var(--ink-3)}
.topbar .right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end}
.burger{display:none}
.view{padding:clamp(16px,2.6vw,26px) clamp(14px,3vw,28px) 60px; max-width:1320px; width:100%}

@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .sidebar{position:fixed; z-index:60; width:min(84vw,var(--sidew)); transform:translateX(-102%); transition:transform .22s ease}
  .sidebar.open{transform:none; box-shadow:0 0 60px rgba(0,0,0,.5)}
  .burger{display:grid; place-items:center}
  .sidescrim{position:fixed; inset:0; background:rgba(10,8,10,.55); z-index:55}
}

/* ================= PRIMITIVES ================= */
.btn{display:inline-flex; align-items:center; gap:7px; background:var(--wine); color:#fff; border-radius:var(--radius);
  padding:9px 14px; font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:12.5px; text-transform:uppercase;
  letter-spacing:.06em; transition:background .13s, opacity .13s; white-space:nowrap}
.btn:hover{background:var(--wine-600)}
.btn svg{width:15px; height:15px; fill:none; stroke:currentColor; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round}
.btn.sec{background:transparent; color:var(--ink); border:1px solid var(--line)}
.btn.sec:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.danger{background:transparent; color:var(--crit); border:1px solid var(--crit)}
.btn.danger:hover{background:var(--crit-bg)}
.btn.sm{padding:6px 10px; font-size:11px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.iconbtn{width:33px; height:33px; display:grid; place-items:center; border:1px solid var(--line); border-radius:var(--radius); flex:none; color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2); color:var(--ink)}
.iconbtn svg{width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line-2)}
.card-head h3{font-size:16px}
.card-head .right{margin-left:auto; display:flex; gap:7px; align-items:center}
.card-body{padding:16px}
.card-body.tight{padding:10px 16px 14px}

.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.kpi{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 15px; box-shadow:var(--shadow)}
.kpi .lab{font-size:10.5px; text-transform:uppercase; letter-spacing:.11em; color:var(--ink-3); font-weight:600}
.kpi .val{font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:30px; line-height:1.05; margin-top:5px; font-variant-numeric:tabular-nums}
.kpi .hint{font-size:11.5px; color:var(--ink-2); margin-top:3px}
.kpi.accent .val{color:var(--wine)}
.kpi.ok .val{color:var(--ok)} .kpi.warn .val{color:var(--warn)} .kpi.crit .val{color:var(--crit)}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase;
  letter-spacing:.07em; padding:3px 8px; border-radius:99px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.badge.ok{background:var(--ok-bg); color:var(--ok); border-color:transparent}
.badge.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.badge.crit{background:var(--crit-bg); color:var(--crit); border-color:transparent}
.badge.info{background:var(--info-bg); color:var(--info); border-color:transparent}
.badge.wine{background:var(--wine-tint); color:var(--wine); border-color:transparent}

.tablewrap{overflow-x:auto}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{text-align:left; font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:10.5px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-3); padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
table.tbl td{padding:10px 12px; border-bottom:1px solid var(--line-2); vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
table.tbl td.act{text-align:right; white-space:nowrap}

.empty{text-align:center; padding:26px 18px; color:var(--ink-2)}
.empty svg{width:34px; height:34px; stroke:var(--ink-3); fill:none; stroke-width:1.5; margin-bottom:8px}
.empty b{display:block; font-family:'Archivo Narrow',sans-serif; font-size:17px; color:var(--ink); margin-bottom:3px}
.empty p{margin:0 auto; max-width:42ch; font-size:13px}

.progress{height:7px; background:var(--line-2); border-radius:99px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--wine); border-radius:99px; transition:width .4s ease}
.progress.done i{background:var(--ok)}

.field{display:flex; flex-direction:column; gap:5px; margin-bottom:13px}
.field > label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-2)}
.field input,.field select,.field textarea{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:9px 11px; color:var(--ink); font-size:14px; width:100%}
.field textarea{min-height:76px; resize:vertical}
.field .help{font-size:11.5px; color:var(--ink-3)}
.fieldrow{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media(max-width:520px){.fieldrow{grid-template-columns:1fr}}

.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:5px 12px; font-size:12px; font-weight:600; color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3)}
.chip[aria-pressed="true"]{background:var(--wine); border-color:var(--wine); color:#fff}

.toolbar{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:14px}
.toolbar .grow{flex:1 1 180px; min-width:0}
.toolbar input,.toolbar select{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:8px 11px; color:var(--ink); font-size:13.5px}

/* ================= KANBAN ================= */
.kanban{display:grid; grid-template-columns:repeat(4,minmax(228px,1fr)); gap:12px; overflow-x:auto; padding-bottom:6px; align-items:start}
@media(max-width:900px){.kanban{grid-template-columns:repeat(4,minmax(220px,1fr))}}
.kcol{background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); min-height:130px; display:flex; flex-direction:column}
.kcol > header{display:flex; align-items:center; gap:7px; padding:10px 12px; border-bottom:1px solid var(--line-2)}
.kcol > header b{font-family:'Archivo Narrow',sans-serif; font-size:12.5px; text-transform:uppercase; letter-spacing:.08em}
.kcol > header i{margin-left:auto; font-style:normal; font-size:11px; font-weight:700; color:var(--ink-3); font-variant-numeric:tabular-nums}
.kcol .body{padding:9px; display:flex; flex-direction:column; gap:8px; flex:1}
.kcol.over{outline:2px dashed var(--wine); outline-offset:-3px}
.kcard{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--ink-3); border-radius:4px; padding:10px 11px; cursor:grab; box-shadow:var(--shadow)}
.kcard:active{cursor:grabbing}
.kcard.p-alta{border-left-color:var(--crit)} .kcard.p-media{border-left-color:var(--warn)} .kcard.p-baixa{border-left-color:var(--info)}
.kcard b{display:block; font-family:'Archivo Narrow',sans-serif; font-size:14.5px; line-height:1.25; margin-bottom:5px}
.kcard .meta{display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:11px; color:var(--ink-3)}
.kcard.dragging{opacity:.4}

/* ================= ARQUIVOS ================= */
.drop{border:1.5px dashed var(--line); border-radius:var(--radius); background:var(--surface-2); padding:20px 16px; text-align:center; transition:border-color .14s, background .14s}
.drop.over{border-color:var(--wine); background:var(--wine-tint)}
.drop svg{width:26px; height:26px; stroke:var(--wine); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.drop b{display:block; font-family:'Archivo Narrow',sans-serif; font-size:15px; margin:6px 0 2px}
.drop p{margin:0; font-size:12px; color:var(--ink-2)}
.filerow{display:flex; align-items:center; gap:11px; padding:9px 2px; border-bottom:1px solid var(--line-2)}
.filerow:last-child{border-bottom:0}
.ftype{width:34px; height:34px; flex:none; border-radius:4px; display:grid; place-items:center; background:var(--wine-tint); color:var(--wine);
  font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.03em}
.filerow .fmain{min-width:0; flex:1}
.filerow .fmain b{display:block; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.filerow .fmain span{font-size:11px; color:var(--ink-3)}
.filerow .fact{display:flex; gap:5px; flex:none}

/* ================= MISC ================= */
.checkline{display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line-2)}
.checkline:last-child{border-bottom:0}
.checkline input[type=checkbox]{width:17px; height:17px; margin-top:2px; accent-color:var(--wine); flex:none}
.checkline .txt{flex:1; min-width:0; font-size:13.5px}
.checkline.done .txt{color:var(--ink-3); text-decoration:line-through}
.avatar{width:30px; height:30px; border-radius:50%; background:var(--wine-tint); color:var(--wine); display:grid; place-items:center;
  font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:12px; flex:none}
.hexi{width:38px; height:43px; background:var(--wine); clip-path:polygon(50% 0%,93.3% 25%,93.3% 75%,50% 100%,6.7% 75%,6.7% 25%);
  display:grid; place-items:center; flex:none}
.hexi svg{width:19px; height:19px; fill:none; stroke:#fff; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round}
.pagehead{display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.pagehead .txt{flex:1 1 320px; min-width:0}
.pagehead h2{font-size:24px; line-height:1.12}
.pagehead p{margin:5px 0 0; color:var(--ink-2); font-size:13.5px; max-width:74ch}
.subtabs{display:flex; gap:0; border-bottom:1px solid var(--line); margin-bottom:16px; overflow-x:auto}
.subtabs button{padding:9px 14px; font-family:'Archivo Narrow',sans-serif; font-weight:700; font-size:12.5px; text-transform:uppercase;
  letter-spacing:.06em; color:var(--ink-3); border-bottom:2px solid transparent; white-space:nowrap}
.subtabs button[aria-pressed="true"]{color:var(--wine); border-bottom-color:var(--wine)}
.money{font-variant-numeric:tabular-nums; font-weight:600}
.money.in{color:var(--ok)} .money.out{color:var(--crit)}
.cal{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.cal .dow{text-align:center; font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700; padding-bottom:3px}
.cal .day{aspect-ratio:1; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:12px; color:var(--ink-2); font-variant-numeric:tabular-nums; position:relative; border:1px solid transparent}
.cal .day.out{color:var(--ink-3); opacity:.4}
.cal .day.today{border-color:var(--wine); font-weight:700; color:var(--wine)}
.cal .day.has{background:var(--wine-tint); color:var(--wine); font-weight:700; cursor:pointer}
.cal .day .dot{width:4px; height:4px; border-radius:50%; background:var(--wine); margin-top:2px}
.stack{display:flex; flex-direction:column; gap:14px}
.rowbetween{display:flex; align-items:center; gap:10px; justify-content:space-between; flex-wrap:wrap}
.muted{color:var(--ink-2); font-size:13px}
.tiny{font-size:11.5px; color:var(--ink-3)}
.divider{height:1px; background:var(--line-2); margin:14px 0}

/* ================= OVERLAY ================= */
.scrim{position:fixed; inset:0; background:rgba(14,10,12,.6); display:grid; place-items:center; padding:16px; z-index:80; overflow-y:auto; animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); width:100%; max-width:520px;
  box-shadow:0 34px 80px -34px rgba(0,0,0,.65); animation:rise .2s ease; margin:auto}
.modal.wide{max-width:760px}
.modal > header{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line-2)}
.modal > header h3{font-size:19px}
.modal .mbody{padding:18px; max-height:min(66vh,620px); overflow-y:auto}
.modal > footer{display:flex; gap:9px; padding:14px 18px; border-top:1px solid var(--line-2); justify-content:flex-end; flex-wrap:wrap}
.modal > footer .left{margin-right:auto}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:95; background:var(--ink); color:var(--paper);
  padding:10px 17px; border-radius:var(--radius); font-size:13px; font-weight:600; box-shadow:0 12px 30px -12px rgba(0,0,0,.6); animation:rise .16s ease}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important; transition-duration:.001ms !important}}
</style>
</head>
<body>


<div class="shell">

/* ---------- IndexedDB ---------- */
const DBN="gepeff-crm", DBV=1;
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DBN,DBV);
    r.onupgradeneeded=()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv");
      if(!d.objectStoreNames.contains("files")) d.createObjectStore("files",{keyPath:"id"});
    };
    r.onsuccess=()=>{ _db=r.result; res(_db); };
    r.onerror=()=>rej(r.error);
  });
}
function tx(store,mode,fn){
  return idb().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(store,mode), s=t.objectStore(store); let out;
    out=fn(s);
    t.oncomplete=()=>res(out && out.result!==undefined ? out.result : out);
    t.onerror=()=>rej(t.error);
  }));
}
const kvGet=k=>tx("kv","readonly",s=>s.get(k));

/* ---------- sincronização (local ou nuvem) ---------- */

async function sync(colecao, obj){
  await salvar();
  if(!naNuvem()) return;
  try{
    const linha=paraLinha(colecao,obj);

function paraLinha(colecao,obj){
  const o=Object.assign({},obj);

function modal(opts){
  const sc=el("div","scrim");
  const m=el("div","modal"+(opts.wide?" wide":""));
  m.setAttribute("role","dialog"); m.setAttribute("aria-modal","true");
  const h=el("header"); h.appendChild(el("h3",null,opts.titulo));
  const x=el("button","iconbtn"); x.type="button"; x.setAttribute("aria-label","Fechar");
  x.innerHTML=svg('<path d="M18 6L6 18M6 6l12 12"/>'); x.style.marginLeft="auto";
  h.appendChild(x); m.appendChild(h);
  const body=el("div","mbody"); m.appendChild(body);
  const foot=el("footer"); m.appendChild(foot);
  const close=()=>sc.remove();
  x.addEventListener("click",close);
  sc.addEventListener("click",e=>{ if(e.target===sc) close(); });
  document.addEventListener("keydown",function k(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",k);} });
  sc.appendChild(m); layer.appendChild(sc);
  opts.corpo(body,close,foot);
  const f=body.querySelector("input,select,textarea,button"); if(f) f.focus();
  return {close, body, foot};
}

    const s=el("button","btn danger",rotulo||"Excluir"); s.type="button";

  }});
}

/* ---------- formulário genérico ---------- */
function form(campos, valores){
  const wrap=el("div"); const inputs={};
  let linha=null;
  campos.forEach(c=>{
    const f=el("div","field");
    if(c.label){ const l=el("label",null,c.label); l.setAttribute("for","f_"+c.k); f.appendChild(l); }
    let inp;
    if(c.tipo==="textarea"){ inp=el("textarea"); }
    else if(c.tipo==="select"){
      inp=el("select");
      (c.vazio!==false)&&inp.appendChild(el("option",null,c.placeholder||"— selecione —"));
      if(c.vazio!==false) inp.lastChild.value="";
      (c.opcoes||[]).forEach(o=>{ const op=el("option",null,typeof o==="string"?o:o.nome); op.value=typeof o==="string"?o:o.id; inp.appendChild(op); });
    }
    else{ inp=el("input"); inp.type=c.tipo||"text"; if(c.tipo==="number"){ inp.step=c.step||"0.01"; inp.min=c.min!=null?c.min:""; } }
    inp.id="f_"+c.k;
    if(c.placeholder && c.tipo!=="select") inp.placeholder=c.placeholder;
    if(c.req) inp.required=true;
    const v=valores?valores[c.k]:undefined;
    if(v!==undefined && v!==null) inp.value=v;
    else if(c.padrao!==undefined) inp.value=c.padrao;
    f.appendChild(inp);
    if(c.ajuda){ const hh=el("div","help",c.ajuda); f.appendChild(hh); }
    inputs[c.k]=inp;
    if(c.meia){
      if(!linha){ linha=el("div","fieldrow"); wrap.appendChild(linha); }
      linha.appendChild(f);
      if(linha.children.length>=2) linha=null;
    } else { linha=null; wrap.appendChild(f); }
  });
  return {wrap, inputs, ler(){ const o={}; Object.keys(inputs).forEach(k=>{ o[k]=inputs[k].value; }); return o; },

/* ---------- saída de arquivo (viewer do Artifact ou host próprio) ---------- */
let _dlP=null;
function dlNamespace(){
  if(_dlP) return _dlP;
  _dlP = (window.claude && typeof window.claude.use==="function")
    ? Promise.resolve(window.claude.use("downloads")).catch(()=>null)
    : Promise.resolve(null);
  return _dlP;
}
function baixarViaAncora(nome, blob){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function entregarArquivo(nome, blob){
  let ns=null;
  try{ ns=await dlNamespace(); }catch(e){ ns=null; }
  if(ns && typeof ns.save==="function"){
    try{ await ns.save({filename:nome, data:blob}); toast("Arquivo salvo"); return true; }
    catch(e){
      const c=e&&e.code;
      if(c==="declined") return false;
      if(c==="rejected_extension"||c==="extension_not_enabled"){
        toast("Esta pré-visualização não salva arquivos ."+(String(nome).split(".").pop()||"")+" — use a versão hospedada"); return false; }
      if(c==="too_large"){ toast("Arquivo grande demais para baixar por aqui"); return false; }
      if(c==="rate_limited"){ toast("Aguarde um instante e tente de novo"); return false; }
    }
  }
  baixarViaAncora(nome, blob);
  return true;
}

/* ---------- arquivos ---------- */
const EXT=n=>{ const p=String(n).split("."); return p.length>1?p.pop().slice(0,4):"?"; };
function caminhoStorage(id,nome,ctxPasta){
  const limpo=String(nome).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w.\-]+/g,"_").slice(-80);
  return (ctxPasta||"geral")+"/"+id+"-"+limpo;
}
async function subirArquivos(lista, ctx){
  let n=0;
  for(const f of lista){
    if(f.size > 25*1024*1024){ toast('"'+f.name+'" passa de 25 MB e foi ignorado'); continue; }
    const id=uid();
    const meta={id, nome:f.name, mime:f.type||"", tam:f.size, dir:ctx.dir||"", cat:ctx.cat||"Outro", quando:Date.now(), ref:ctx.ref||"", path:""};
    if(naNuvem()){
      meta.path=caminhoStorage(id,f.name,ctx.pasta||ctx.dir||"geral");
      try{
        const {error}=await sb.storage.from(NUVEM.bucket).upload(meta.path,f,{upsert:true,contentType:f.type||undefined});
        if(error) throw error;
      }catch(e){ console.warn(e); toast('Falha ao enviar "'+f.name+'" para a nuvem'); continue; }
    }
    await filePut({id, blob:f});
    S.arquivos.push(meta);
    await sync("arquivos",meta);
    n++;
  }
  if(n) toast(n===1?"1 arquivo enviado":n+" arquivos enviados");
  return n;
}
async function obterBlob(meta){
  const rec=await fileGet(meta.id);
  if(rec && rec.blob) return rec.blob;
  if(naNuvem() && meta.path){
    try{
      const {data,error}=await sb.storage.from(NUVEM.bucket).download(meta.path);
      if(error) throw error;
      await filePut({id:meta.id, blob:data});
      return data;
    }catch(e){ console.warn(e); }
  }
  return null;
}
function dropzone(ctx, aoSubir){
  const d=el("div","drop");
  d.innerHTML=svg('<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>')+
    '<b>Arraste arquivos aqui</b><p>PDF, imagem, roteiro, planilha, slide — qualquer formato, até 25 MB por arquivo</p>';
  const inp=el("input"); inp.type="file"; inp.multiple=true; inp.style.display="none";
  const b=el("button","btn sm sec","Escolher arquivos"); b.type="button"; b.style.marginTop="11px";
  b.addEventListener("click",()=>inp.click());
  inp.addEventListener("change",async()=>{ if(inp.files.length){ await subirArquivos(inp.files,ctx); inp.value=""; aoSubir&&aoSubir(); } });
  d.appendChild(b); d.appendChild(inp);
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",async e=>{ const fs=e.dataTransfer&&e.dataTransfer.files; if(fs&&fs.length){ await subirArquivos(fs,ctx); aoSubir&&aoSubir(); } });
  return d;
}
async function verArquivo(meta){
  const blob=await obterBlob(meta);
  if(!blob){ toast("Arquivo indisponível — não está neste navegador nem na nuvem"); return; }
  const url=URL.createObjectURL(blob);
  modal({titulo:meta.nome, wide:true, corpo:(b,close,foot)=>{
    const m=meta.mime||"";
    if(m.startsWith("image/")){ const i=el("img"); i.src=url; i.alt=meta.nome; i.style.cssText="max-width:100%;border-radius:4px;display:block;margin:0 auto"; b.appendChild(i); }
    else if(m==="application/pdf"){ const f=el("iframe"); f.src=url; f.style.cssText="width:100%;height:60vh;border:1px solid var(--line);border-radius:4px"; b.appendChild(f); }
    else if(m.startsWith("text/")||/\.(txt|csv|md|json)$/i.test(meta.nome)){
      const pre=el("pre"); pre.style.cssText="white-space:pre-wrap;font-size:12.5px;background:var(--surface-2);padding:12px;border-radius:4px;max-height:56vh;overflow:auto";
      blob.text().then(t=>{ pre.textContent=t.slice(0,200000); }); b.appendChild(pre);
    }
    else{
      const p=el("p",null,"Pré-visualização não disponível para este formato ("+(m||EXT(meta.nome))+"). Use o botão Baixar.");
      p.style.color="var(--ink-2)"; b.appendChild(p);
    }
    const info=el("div","tiny", bytes(meta.tam)+" · enviado em "+new Date(meta.quando).toLocaleDateString("pt-BR")+(meta.dir?" · "+dirNome(meta.dir):""));
    info.style.marginTop="10px"; b.appendChild(info);
    const bx=el("button","btn sec","Fechar"); bx.type="button"; bx.addEventListener("click",()=>{URL.revokeObjectURL(url);close();});
    const bd=el("button","btn","Baixar"); bd.type="button"; bd.addEventListener("click",()=>baixarArquivo(meta));
    foot.appendChild(bx); foot.appendChild(bd);
  }});
}
async function baixarArquivo(meta){
  const blob=await obterBlob(meta);
  if(!blob){ toast("Arquivo indisponível"); return; }
  await entregarArquivo(meta.nome, blob);
}
async function excluirArquivo(meta, depois){
  confirmar("Excluir arquivo", '"'+meta.nome+'" será removido definitivamente'+(naNuvem()?" da nuvem e deste navegador.":" deste navegador."), async()=>{
    if(naNuvem() && meta.path){ try{ await sb.storage.from(NUVEM.bucket).remove([meta.path]); }catch(e){ console.warn(e); } }
    await fileDel(meta.id);
    S.arquivos=S.arquivos.filter(a=>a.id!==meta.id);
    await syncRemover("arquivos",meta.id); toast("Arquivo excluído"); depois&&depois();
  });
}
function listaArquivos(itens, depois, mostrarDir){
  if(!itens.length) return vazio("Nenhum arquivo ainda","Envie atas, roteiros, artes, comprovantes, slides — o que a área precisa guardar.");

  return w;

let filtroTarefa={dir:"", resp:"", q:"", atraso:false};
function novaTarefa(ctx, existente){
  const campos=[
    {k:"titulo",label:"Tarefa",req:true,placeholder:"O que precisa ser feito"},
    {k:"dir",label:"Diretoria",tipo:"select",opcoes:S.dirs.filter(d=>podeEditarDir(d.id)).map(d=>({id:d.id,nome:d.nome})),req:true,meia:true},
    {k:"responsavel",label:"Responsável",placeholder:"Quem assume",meia:true},
    {k:"prazo",label:"Prazo",tipo:"date",meia:true},
    {k:"prioridade",label:"Prioridade",tipo:"select",opcoes:PRIORIDADES,vazio:false,meia:true},
    {k:"status",label:"Status",tipo:"select",opcoes:STATUS_TAREFA,vazio:false},
    {k:"detalhes",label:"Detalhes",tipo:"textarea",placeholder:"Contexto, links, o que conta como pronto"}
  ];
  const vals=existente||{dir:(ctx&&ctx.dir)||"",prioridade:"media",status:"backlog"};
  formModal(existente?"Editar tarefa":"Nova tarefa",campos,vals,async(v,close)=>{
    let alvo=existente;
    if(alvo) Object.assign(alvo,v);
    else { alvo=Object.assign({id:uid(),criado:Date.now()},v); S.tarefas.push(alvo); }
    await sync("tarefas",alvo); close(); renderNav(); render();
  }, existente?{excluir:()=>confirmar("Excluir tarefa",'"'+existente.titulo+'" será removida.',async()=>{
    S.tarefas=S.tarefas.filter(t=>t.id!==existente.id); await syncRemover("tarefas",existente.id); renderNav(); render(); toast("Tarefa excluída"); })}:null);
}
function vTarefas(){
  const v=$("#view"); v.innerHTML="";
  cabecalho("Tarefas","Quadro de trabalho das nove diretorias",[botao("Nova tarefa",()=>novaTarefa(),"",'<path d="M12 5v14M5 12h14"/>')]);

  const tb=el("div","toolbar");
  const selD=el("select"); selD.appendChild(new Option(souGestao()?"Todas as diretorias":"Meu setor",""));
  dirsVisiveis().forEach(d=>selD.appendChild(new Option(d.nome,d.id)));
  selD.value=filtroTarefa.dir; selD.addEventListener("change",()=>{filtroTarefa.dir=selD.value; vTarefas();});
  const inpQ=el("input"); inpQ.className="grow"; inpQ.placeholder="Buscar por título ou responsável"; inpQ.value=filtroTarefa.q;
  inpQ.addEventListener("input",()=>{filtroTarefa.q=inpQ.value; desenharQuadro();});
  const bAtr=el("button","chip","Só atrasadas"); bAtr.type="button"; bAtr.setAttribute("aria-pressed",String(filtroTarefa.atraso));
  bAtr.addEventListener("click",()=>{filtroTarefa.atraso=!filtroTarefa.atraso; vTarefas();});
  tb.appendChild(selD); tb.appendChild(inpQ); tb.appendChild(bAtr);
  v.appendChild(tb);

  const quadro=el("div","kanban"); v.appendChild(quadro);

  function filtradas(){
    return S.tarefas.filter(t=>{
      if(filtroTarefa.dir && t.dir!==filtroTarefa.dir) return false;
      if(filtroTarefa.atraso && !(t.prazo && diasAte(t.prazo)<0 && t.status!=="concluido")) return false;
      const q=norm(filtroTarefa.q);
      if(q && !(norm(t.titulo).includes(q)||norm(t.responsavel).includes(q))) return false;
      return true;
    });
  }
  function desenharQuadro(){
    quadro.innerHTML="";
    const lista=filtradas();
    STATUS_TAREFA.forEach(st=>{
      const col=el("div","kcol"); col.dataset.st=st.id;
      const h=el("header"); h.appendChild(el("b",null,st.nome));
      const itens=lista.filter(t=>t.status===st.id);
      h.appendChild(el("i",null,String(itens.length)));
      col.appendChild(h);
      const body=el("div","body"); col.appendChild(body);
      itens.sort((a,b)=>(a.prazo||"9999").localeCompare(b.prazo||"9999")).forEach(t=>{
        const c=el("div","kcard p-"+(t.prioridade||"media")); c.draggable=true; c.dataset.id=t.id;
        c.appendChild(el("b",null,t.titulo));
        const m=el("div","meta");
        m.appendChild(badge(dirNome(t.dir),"wine"));
        if(t.responsavel) m.appendChild(el("span",null,t.responsavel));
        if(t.prazo){ const dd=diasAte(t.prazo);
          m.appendChild(badge(fmtDataCurta(t.prazo), (dd<0&&t.status!=="concluido")?"crit":(dd<=3&&t.status!=="concluido")?"warn":"")); }
        c.appendChild(m);
        c.addEventListener("click",()=>novaTarefa(null,t));
        c.addEventListener("dragstart",e=>{ e.dataTransfer.setData("text/plain",t.id); c.classList.add("dragging"); });
        c.addEventListener("dragend",()=>c.classList.remove("dragging"));
        body.appendChild(c);
      });
      if(!itens.length){ const p=el("div","tiny","Nada aqui"); p.style.cssText="text-align:center;padding:14px 4px"; body.appendChild(p); }
      col.addEventListener("dragover",e=>{ e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave",()=>col.classList.remove("over"));
      col.addEventListener("drop",async e=>{
        e.preventDefault(); col.classList.remove("over");
        const id=e.dataTransfer.getData("text/plain");
        const t=S.tarefas.find(x=>x.id===id);
        if(t && t.status!==st.id){ t.status=st.id; await sync("tarefas",t); renderNav(); desenharQuadro(); }
      });
      quadro.appendChild(col);
    });
    if(!lista.length){ quadro.innerHTML=""; quadro.style.display="block"; quadro.appendChild(vazio("Nenhuma tarefa","Abra a primeira tarefa e arraste entre as colunas conforme ela avança.",{rotulo:"Nova tarefa",fn:()=>novaTarefa()})); }
    else quadro.style.display="grid";
  }
  desenharQuadro();
}

  const linha=el("div","grid"); linha.style.gridTemplateColumns="minmax(260px,340px) 1fr";
  if(window.innerWidth<820) linha.style.gridTemplateColumns="1fr";

  const cc=card(nomeMes.charAt(0).toUpperCase()+nomeMes.slice(1),[
    miniBtn("‹",()=>{ mesRef=new Date(mesRef.getFullYear(),mesRef.getMonth()-1,1); vAgenda(); }),

  ]);
  const cal=el("div","cal");
  ["D","S","T","Q","Q","S","S"].forEach(d=>cal.appendChild(el("div","dow",d)));
  const inicio=new Date(mesRef.getFullYear(),mesRef.getMonth(),1);
  const offset=inicio.getDay();
  const diasMes=new Date(mesRef.getFullYear(),mesRef.getMonth()+1,0).getDate();
  for(let i=0;i<offset;i++) cal.appendChild(el("div","day out",""));
  for(let dnum=1;dnum<=diasMes;dnum++){
    const iso=mesRef.getFullYear()+"-"+String(mesRef.getMonth()+1).padStart(2,"0")+"-"+String(dnum).padStart(2,"0");
    const evs=S.eventos.filter(e=>e.data===iso);
    const cel=el("div","day"+(iso===hojeISO()?" today":"")+(evs.length?" has":""));
    cel.appendChild(el("span",null,String(dnum)));
    if(evs.length){ cel.appendChild(el("span","dot")); cel.title=evs.map(e=>e.titulo).join(" · ");
      cel.addEventListener("click",()=>novoEvento(evs[0])); }
    cal.appendChild(cel);
  }
  cc.body.appendChild(cal);
  linha.appendChild(cc);

  /* lista */
  const futuros=S.eventos.filter(e=>diasAte(e.data)>=0).sort((a,b)=>a.data.localeCompare(b.data));
  const passados=S.eventos.filter(e=>diasAte(e.data)<0).sort((a,b)=>b.data.localeCompare(a.data));
  const cl=card("Próximos compromissos");
  if(!futuros.length) cl.body.appendChild(vazio("Agenda vazia","Cadastre o calendário do semestre: encontros, minicursos, ciclo de palestras e prazos de edital.",{rotulo:"Novo evento",fn:()=>novoEvento()}));
  futuros.forEach(e=>{
    const dd=diasAte(e.data);
    const r=el("div"); r.style.cssText="display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line-2);cursor:pointer";
    r.addEventListener("click",()=>novoEvento(e));
    const dbox=el("div"); dbox.style.cssText="text-align:center;min-width:46px";
    const dn=el("div",null,String(dISO(e.data).getDate())); dn.style.cssText="font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:21px;line-height:1;color:var(--wine)";
    dbox.appendChild(dn);
    dbox.appendChild(el("div","tiny",dISO(e.data).toLocaleDateString("pt-BR",{month:"short"}).replace(".","")));

function pctPresenca(mid){
  const ids=S.encontros.map(e=>e.id);
  if(!ids.length) return null;
  let p=0; ids.forEach(id=>{ if(S.presencas[id] && S.presencas[id][mid]) p++; });
  return Math.round(p/ids.length*100);
}

/* ================= CONEXÃO COM A NUVEM ================= */
function libSupabase(){
  return new Promise(res=>{
    if(window.__criarClienteSupabase) return res(window.__criarClienteSupabase);
    let pronto=false;
    const ok=()=>{ if(!pronto){ pronto=true; res(window.__criarClienteSupabase||null); } };
    window.addEventListener("supabase-pronto",ok,{once:true});
    window.addEventListener("supabase-falhou",()=>{ if(!pronto){ pronto=true; res(null); } },{once:true});
    setTimeout(ok,9000);
  });
}
function statusNuvem(){
  const el2=$("#sideStatus"); if(!el2) return;
  el2.className="sidestatus "+(modo==="nuvem"?"on":"off");
  el2.textContent = modo==="nuvem"
    ? ("Nuvem · "+((perfil&&perfil.nome)?perfil.nome.split(" ")[0]:(usuario?usuario.email:"conectado")))
    : ("Modo local"+(avisoNuvem?" · "+avisoNuvem:""));
}
async function conectarNuvem(){
  if(!NUVEM.url || !NUVEM.chave){ avisoNuvem="sem configuração"; statusNuvem(); return; }
  const criar=await libSupabase();
  if(!criar){ avisoNuvem="biblioteca não carregou"; statusNuvem(); return; }
  try{
    sb=criar(NUVEM.url,NUVEM.chave,{auth:{persistSession:true,autoRefreshToken:true}});
    const {data,error}=await sb.auth.getSession();
    if(error) throw error;
    if(data && data.session){ usuario=data.session.user; await entrarNaNuvem(); }
    else telaLogin();
  }catch(e){
    console.warn("nuvem",e);
    sb=null; avisoNuvem="servidor fora de alcance"; statusNuvem();
  }
}
async function carregarPerfil(){
  perfil=null;
  try{
    const {data,error}=await sb.from("perfis").select("*").eq("user_id",usuario.id).maybeSingle();
    if(error) throw error;
    perfil=data||null;
  }catch(e){ console.warn("perfil",e); }
  if(!perfil) perfil={nome:(usuario&&usuario.email)||"", setor:null, papel:"diretor", financeiro:false};
}
async function entrarNaNuvem(){
  modo="nuvem"; statusNuvem();
  try{
    await carregarPerfil();
    const vazio=await baixarTudo();
    if(vazio){
      if(souGestao()){ await enviarTudo(); toast("Primeira carga enviada para a nuvem"); }
      else toast("A base do grupo ainda está vazia — peça à coordenação para fazer a primeira carga");
    }
  }catch(e){
    console.warn(e); modo="local"; avisoNuvem="falha ao ler os dados"; statusNuvem();
    toast("Conectei, mas não consegui ler os dados — seguindo em modo local");
    return;
  }
  renderNav(); render(); statusNuvem();
}
async function baixarTudo(){
  const pega=async t=>{ const {data,error}=await sb.from(t).select("*"); if(error) throw error; return data||[]; };
  const [dirs,objs,necs,tar,fin,evs,mem,enc,pres,apr,arq,cfg]=await Promise.all([
    pega("diretorias"),pega("objetivos"),pega("necessidades"),pega("tarefas"),pega("financeiro"),
    pega("eventos"),pega("membros"),pega("encontros"),pega("presencas"),pega("apresentacoes"),
    pega("arquivos"),pega("config")
  ]);
  if(!dirs.length) return true; /* nuvem vazia */
  /* guarda o que existia só neste navegador antes de ser substituído */
  const local=S, tinhaCoisa = local.tarefas.length||local.fin.length||local.membros.length||local.apres.length||local.eventos.length;
  if(tinhaCoisa){ try{ await kvSet("db_antes_nuvem", JSON.parse(JSON.stringify(local))); }catch(e){} }
  const base=estadoInicial();
  S.dirs = base.dirs.map(padrao=>{
    const linha=dirs.find(x=>x.id===padrao.id)||{};
    return Object.assign({}, padrao, {
      nome:linha.nome||padrao.nome, cargo:linha.cargo||padrao.cargo, icone:padrao.icone,
      descricao:linha.descricao||padrao.descricao, responsavel:linha.responsavel||"", contato:linha.contato||"", notas:linha.notas||"",
      objetivos:objs.filter(o=>o.dir===padrao.id).map(o=>({id:o.id,texto:o.texto,feito:!!o.feito,prazo:o.prazo||""})),
      necessidades:necs.filter(n=>n.dir===padrao.id).map(n=>({id:n.id,texto:n.texto,prioridade:n.prioridade||"media",resolvido:!!n.resolvido}))
    });
  });
  S.tarefas=tar; S.fin=fin; S.eventos=evs; S.membros=mem; S.encontros=enc; S.apres=apr; S.arquivos=arq;
  S.presencas={};
  enc.forEach(e=>{ S.presencas[e.id]={}; });
  pres.forEach(r=>{ if(!S.presencas[r.encontro_id]) S.presencas[r.encontro_id]={}; S.presencas[r.encontro_id][r.membro_id]=!!r.presente; });
  const m=cfg.find(c=>c.chave==="meta"); if(m && m.valor) Object.assign(S.meta,m.valor);
  await salvar();
  return false;
}
async function enviarTudo(){
  if(!naNuvem()) return;
  const env=async(t,linhas)=>{ if(!linhas.length) return; const {error}=await sb.from(t).upsert(linhas); if(error) throw error; };
  await env("diretorias", S.dirs.map(d=>({id:d.id,nome:d.nome,cargo:d.cargo,icone:d.icone,descricao:d.descricao,
    responsavel:d.responsavel||"",contato:d.contato||"",notas:d.notas||""})));
  const objs=[], necs=[];
  S.dirs.forEach(d=>{
    d.objetivos.forEach(o=>objs.push({id:o.id,dir:d.id,texto:o.texto,feito:!!o.feito,prazo:o.prazo||null}));
    d.necessidades.forEach(n=>necs.push({id:n.id,dir:d.id,texto:n.texto,prioridade:n.prioridade,resolvido:!!n.resolvido}));
  });
  await env("objetivos",objs); await env("necessidades",necs);
  await env("tarefas", S.tarefas.map(x=>paraLinha("tarefas",x)));
  await env("financeiro", S.fin.map(x=>paraLinha("fin",x)));
  await env("eventos", S.eventos.map(x=>paraLinha("eventos",x)));
  await env("membros", S.membros.map(x=>paraLinha("membros",x)));
  await env("encontros", S.encontros.map(x=>paraLinha("encontros",x)));
  await env("apresentacoes", S.apres.map(x=>paraLinha("apres",x)));
  await env("arquivos", S.arquivos.map(x=>paraLinha("arquivos",x)));
  const pres=[];
  Object.keys(S.presencas).forEach(eid=>Object.keys(S.presencas[eid]).forEach(mid=>
    pres.push({encontro_id:eid, membro_id:mid, presente:!!S.presencas[eid][mid]})));
  await env("presencas",pres);
  await env("config",[{chave:"meta", valor:S.meta}]);
}
function telaLogin(){
  modo="local"; statusNuvem();
  const sc=el("div","scrim"); sc.style.zIndex="90";
  const m=el("div","modal"); m.style.maxWidth="420px";
  const h=el("header"); h.appendChild(el("h3",null,"Entrar no GEPEFF Gestão")); m.appendChild(h);
  const b=el("div","mbody");
  const p=el("p","muted","Use o e-mail e a senha cadastrados pela Diretoria Executiva. Sem entrar, o sistema funciona só neste navegador e nada é compartilhado.");
  p.style.marginTop="0"; b.appendChild(p);
  const fm=form([{k:"email",label:"E-mail",tipo:"email",req:true,placeholder:"voce@exemplo.com"},
                 {k:"senha",label:"Senha",tipo:"password",req:true}]);
  b.appendChild(fm.wrap);
  const erro=el("div","feedback"); erro.style.cssText="color:var(--crit);font-size:13px;min-height:18px;font-weight:600"; b.appendChild(erro);
  m.appendChild(b);
  const f=el("footer");
  const local=el("button","btn sec","Usar sem entrar"); local.type="button";
  local.addEventListener("click",()=>{ sc.remove(); avisoNuvem="sem login"; statusNuvem(); });
  const ok=el("button","btn","Entrar"); ok.type="button";
  const tentar=async()=>{
    if(!fm.valido()) return;
    const v=fm.ler(); ok.disabled=true; erro.textContent="";
    try{
      const {data,error}=await sb.auth.signInWithPassword({email:v.email.trim(),password:v.senha});
      if(error) throw error;
      usuario=data.user; sc.remove(); await entrarNaNuvem(); toast("Conectado à nuvem do grupo");
    }catch(e){
      erro.textContent = /Invalid login/i.test(e.message||"") ? "E-mail ou senha incorretos." : ("Não deu para entrar: "+(e.message||"erro desconhecido"));
      ok.disabled=false;
    }
  };
  ok.addEventListener("click",tentar);
  fm.inputs.senha.addEventListener("keydown",e=>{ if(e.key==="Enter") tentar(); });
  f.appendChild(local); f.appendChild(ok); m.appendChild(f);
  sc.appendChild(m); layer.appendChild(sc);
  fm.inputs.email.focus();
}
async function sairDaNuvem(){
  try{ await sb.auth.signOut(); }catch(e){}
  usuario=null; perfil=null; modo="local"; avisoNuvem="desconectado"; statusNuvem();
  toast("Você saiu — os dados continuam neste navegador");
  render();
}

/* ================= CONFIGURAÇÕES ================= */
function vConfig(){
  const v=$("#view"); v.innerHTML="";
  cabecalho("Configurações","Dados do grupo, backup e migração",[]);

  const c1=card("Identificação");
  const fm=form([
    {k:"grupo",label:"Nome do grupo",meia:true},
    {k:"semestre",label:"Semestre vigente",placeholder:"2026/2",meia:true}
  ],S.meta);
  c1.body.appendChild(fm.wrap);
  if(souGestao()) c1.body.appendChild(botao("Salvar",async()=>{ Object.assign(S.meta,fm.ler()); await syncMeta(); renderNav(); render(); toast("Salvo"); }));
  else { Object.values(fm.inputs).forEach(i=>i.disabled=true); c1.body.appendChild(el("div","tiny","Somente a coordenação altera a identificação do grupo.")); }
  v.appendChild(c1);

  const c2=card("Backup e transferência"); c2.style.marginTop="14px";
  const p=el("p","muted","Exporta todos os registros (diretorias, tarefas, financeiro, agenda, membros, presenças e apresentações) em um JSON. Os arquivos enviados não entram no JSON — baixe-os pela biblioteca quando precisar movê-los.");
  p.style.marginTop="0"; c2.body.appendChild(p);
  const row=el("div"); row.style.cssText="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px";
  row.appendChild(botao("Exportar JSON",exportarJSON,"sec"));
  row.appendChild(botao("Importar JSON",importarJSON,"sec"));
  if(souGestao()) row.appendChild(botao("Apagar tudo",()=>confirmar("Apagar todos os dados","Registros e arquivos deste navegador serão removidos e as diretorias voltam ao padrão. Não dá para desfazer.",async()=>{
    for(const a of S.arquivos){ try{ await fileDel(a.id); }catch(e){} }
    S=estadoInicial(); await salvar();
    if(naNuvem()){ try{ await enviarTudo(); }catch(e){ toast("Apaguei aqui, mas a nuvem não foi atualizada"); } }
    renderNav(); irPara("painel"); toast("Tudo apagado");
  },"Apagar tudo"),"danger"));
  c2.body.appendChild(row);
  v.appendChild(c2);

  const c3=card("Conexão"); c3.style.marginTop="14px";
  const box=el("div");
  if(modo==="nuvem"){
    box.style.cssText="background:var(--ok-bg);border-left:3px solid var(--ok);padding:12px 14px;border-radius:4px;font-size:13.5px;line-height:1.55";
    box.innerHTML="<b>Conectado à nuvem do grupo.</b> Tudo que você registra aqui aparece para as outras diretorias que entrarem com o próprio login. Os arquivos vão para o armazenamento do Supabase.";
  } else {
    box.style.cssText="background:var(--warn-bg);border-left:3px solid var(--warn);padding:12px 14px;border-radius:4px;font-size:13.5px;line-height:1.55";
    box.innerHTML="<b>Modo local"+(avisoNuvem?" ("+avisoNuvem+")":"")+".</b> Os registros estão apenas neste navegador e não são compartilhados. Entre com seu login para trabalhar na base do grupo.";
  }
  c3.body.appendChild(box);
  const info=el("div","muted"); info.style.marginTop="10px";
  if(modo==="nuvem" && perfil){
    const l1=el("div",null,(perfil.nome||usuario.email)+" · "+(usuario?usuario.email:""));
    const papeis={orientadora:"Orientadora — acesso a todos os setores, inclusive o financeiro",
                  coordenacao:"Coordenação — acesso a todos os setores, exceto o financeiro",
                  diretor:"Responsável de setor"};
    const l2=el("div",null,(papeis[perfil.papel]||perfil.papel)+(perfil.setor?" · "+dirNome(perfil.setor):""));
    l2.style.marginTop="2px";
    info.appendChild(l1); info.appendChild(l2);
  } else info.textContent="Nenhuma sessão ativa.";
  c3.body.appendChild(info);
  const acoes=el("div"); acoes.style.cssText="display:flex;gap:9px;flex-wrap:wrap;margin-top:12px";
  if(modo==="nuvem"){
    acoes.appendChild(botao("Recarregar da nuvem",async()=>{ try{ await baixarTudo(); renderNav(); render(); toast("Dados atualizados"); }catch(e){ toast("Não consegui recarregar"); } },"sec"));
    acoes.appendChild(botao("Trocar minha senha",trocarSenha,"sec"));
    if(souGestao()) acoes.appendChild(botao("Enviar tudo desta máquina",()=>confirmar("Enviar para a nuvem",
      "Os registros deste navegador vão sobrescrever os equivalentes na base do grupo. Use quando tiver trabalhado offline.",
      async()=>{ try{ await enviarTudo(); toast("Dados enviados"); }catch(e){ toast("Falha ao enviar"); } },"Enviar"),"sec"));
    acoes.appendChild(botao("Sair da conta",()=>sairDaNuvem(),"danger"));
    kvGet("db_antes_nuvem").then(bkp=>{
      if(!bkp) return;
      const av=el("div","muted"); av.style.marginTop="12px";
      av.textContent="Há uma cópia dos registros que existiam neste navegador antes de você entrar na nuvem.";
      c3.body.appendChild(av);
      c3.body.appendChild(botao("Restaurar cópia local anterior",()=>confirmar("Restaurar cópia",
        "Os registros que estavam neste navegador antes do login voltam e são enviados para a nuvem, sobrescrevendo os equivalentes.",
        async()=>{ S=Object.assign(estadoInicial(),bkp); await salvar();
          try{ await enviarTudo(); }catch(e){ toast("Restaurei aqui, mas a nuvem não recebeu"); }
          renderNav(); irPara("painel"); toast("Cópia restaurada"); },"Restaurar"),"sec"));
    });
  } else {
    acoes.appendChild(botao("Entrar",()=>{ if(sb) telaLogin(); else conectarNuvem(); }));
  }
  c3.body.appendChild(acoes);
  v.appendChild(c3);

  const c4=card("Resumo do que está guardado"); c4.style.marginTop="14px";
  const g=el("div","grid g4");
  [["Diretorias",S.dirs.length],["Tarefas",S.tarefas.length],["Movimentações",S.fin.length],["Eventos",S.eventos.length],
   ["Integrantes",S.membros.length],["Encontros",S.encontros.length],["Apresentações",S.apres.length],["Arquivos",S.arquivos.length]]
   .forEach(([k,n])=>g.appendChild(kpi(k,String(n))));
  c4.body.appendChild(g);
  v.appendChild(c4);
}
function trocarSenha(){
  formModal("Trocar minha senha",[
    {k:"nova",label:"Nova senha",tipo:"password",req:true,ajuda:"Mínimo de 8 caracteres. Use uma senha que só você saiba."},
    {k:"confere",label:"Repita a nova senha",tipo:"password",req:true}
  ],null,async(v,close)=>{
    if(v.nova.length<8){ toast("A senha precisa de pelo menos 8 caracteres"); return; }
    if(v.nova!==v.confere){ toast("As duas senhas não são iguais"); return; }
    try{
      const {error}=await sb.auth.updateUser({password:v.nova});
      if(error) throw error;
      close(); toast("Senha trocada");
    }catch(e){ toast("Não deu para trocar: "+(e.message||"erro")); }
  });
}
function exportarJSON(){
  const dump=JSON.parse(JSON.stringify(S));
  entregarArquivo("gepeff-crm-"+hojeISO()+".json", new Blob([JSON.stringify(dump,null,2)],{type:"application/json"}));
}
function importarJSON(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept="application/json";
  inp.addEventListener("change",async()=>{
    const f=inp.files[0]; if(!f) return;
    try{
      const obj=JSON.parse(await f.text());
      if(!obj.dirs) throw new Error("formato");
      confirmar("Importar backup","Os registros atuais serão substituídos pelos do arquivo. Os arquivos enviados continuam onde estão.",async()=>{
        S=Object.assign(estadoInicial(),obj); await salvar();
        if(naNuvem()){ try{ await enviarTudo(); }catch(e){ toast("Importei aqui, mas a nuvem não foi atualizada"); } }
        renderNav(); irPara("painel"); toast("Backup importado");
      },"Importar");
    }catch(e){ toast("Arquivo inválido"); }
  });
  inp.click();
}

/* ================= RENDER ================= */
function cabecalho(titulo,sub,acoes){
  $("#pgTitle").textContent=titulo;
  $("#pgSub").textContent=sub||"";
  const a=$("#pgActions"); a.innerHTML="";
  (acoes||[]).forEach(b=>a.appendChild(b));
}
function semAcesso(titulo,texto){
  const v=$("#view"); v.innerHTML="";
  cabecalho(titulo,"Acesso restrito",[]);
  const c=card(); c.body.appendChild(vazio("Você não tem acesso a esta área",texto,
    {rotulo:"Voltar ao painel", fn:()=>irPara("painel")}));
  v.appendChild(c);
}
function render(){
  if(rota.v==="dir" && !podeVerDir(rota.id))
    return semAcesso(dirNome(rota.id), "Seu login responde pela "+(meuSetor()?dirNome(meuSetor()):"sua área")+". Fale com a coordenação se precisar acompanhar outra diretoria.");
  if(rota.v==="financeiro" && !vejoFinanceiro())
    return semAcesso("Financeiro", "O caixa do grupo é visível apenas para a Tesouraria e para a orientadora.");
  switch(rota.v){
    case "dir": vDiretoria(rota.id); break;
    case "tarefas": vTarefas(); break;
    case "financeiro": vFinanceiro(); break;
    case "agenda": vAgenda(); break;
    case "membros": vMembros(); break;
    case "apresentacoes": vApresentacoes(); break;
    case "arquivos": vArquivos(); break;
    case "config": vConfig(); break;
    default: vPainel();
  }
}

/* ================= TEMA / MENU ================= */
function aplicarTema(){
  if(S.tema) document.documentElement.setAttribute("data-theme",S.tema);
  else document.documentElement.removeAttribute("data-theme");
}
function ligarChrome(){
  $("#themeBtn").addEventListener("click",()=>{
    const atual=S.tema||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
    S.tema=atual==="dark"?"light":"dark"; aplicarTema(); salvar();
  });
  $("#burger").addEventListener("click",()=>{
    const sb=$("#sidebar");
    if(sb.classList.contains("open")) fecharMenu();
    else{ sb.classList.add("open"); const s=el("div","sidescrim"); s.addEventListener("click",fecharMenu); document.body.appendChild(s); }
  });
}

/* ================= BOOT ================= */
(async function(){
  try{
    await carregar();
  }catch(e){
    document.getElementById("view").innerHTML='<div class="empty"><b>Não foi possível abrir o banco local</b><p>Este navegador bloqueou o armazenamento (janela anônima ou cookies de site desativados). Abra em uma janela normal para usar o sistema.</p></div>';
    return;
  }
  aplicarTema(); ligarChrome(); renderNav(); render(); dlNamespace(); statusNuvem(); conectarNuvem();
})();
})();
